<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .file-upload {
            border: 2px dashed #ccc;
            padding: 2rem;
            text-align: center;
            margin: 1rem 0;
            cursor: pointer;
        }
        .file-upload:hover {
            border-color: #0d6efd;
        }
        .preview-container {
            margin-top: 1rem;
        }
        .preview-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem;
            background: #f8f9fa;
            margin-bottom: 0.5rem;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h2 class="mb-4">Add New Project</h2>
            <form id="projectForm" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>

                <div class="mb-3">
                    <label for="title" class="form-label">Project Title</label>
                    <input type="text" class="form-control" id="title" name="title" required>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Project Description</label>
                    <textarea class="form-control" id="description" name="description" rows="4" required></textarea>
                </div>

                <div class="mb-3">
                    <label for="technologies" class="form-label">Technologies Used</label>
                    <input type="text" class="form-control" id="technologies" name="technologies" 
                           placeholder="Enter technologies separated by commas">
                    <small class="text-muted">Example: JavaScript, React, Node.js</small>
                </div>

                <div class="row mb-3">
                    <div class="col">
                        <label for="startDate" class="form-label">Start Date</label>
                        <input type="date" class="form-control" id="startDate" name="startDate">
                    </div>
                    <div class="col">
                        <label for="endDate" class="form-label">End Date</label>
                        <input type="date" class="form-control" id="endDate" name="endDate">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Project File</label>
                    <div class="file-upload" id="fileUpload">
                        <input type="file" id="projectFile" name="projectFile" accept=".pdf,.doc,.docx" style="display: none;">
                        <p class="mb-0">Click to upload or drag and drop</p>
                        <small class="text-muted">PDF, DOC, DOCX (max 5MB)</small>
                    </div>
                    <div class="preview-container" id="filePreview"></div>
                </div>

                <button type="submit" class="btn btn-primary">Add Project</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const fileUpload = document.getElementById('fileUpload');
            const fileInput = document.getElementById('projectFile');
            const filePreview = document.getElementById('filePreview');
            const projectForm = document.getElementById('projectForm');

            // Handle file upload click
            fileUpload.addEventListener('click', () => fileInput.click());

            // Handle file drag and drop
            fileUpload.addEventListener('dragover', (e) => {
                e.preventDefault();
                fileUpload.style.borderColor = '#0d6efd';
            });

            fileUpload.addEventListener('dragleave', () => {
                fileUpload.style.borderColor = '#ccc';
            });

            fileUpload.addEventListener('drop', (e) => {
                e.preventDefault();
                fileUpload.style.borderColor = '#ccc';
                fileInput.files = e.dataTransfer.files;
                updateFilePreview();
            });

            // Handle file selection
            fileInput.addEventListener('change', updateFilePreview);

            function updateFilePreview() {
                filePreview.innerHTML = '';
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const previewItem = document.createElement('div');
                    previewItem.className = 'preview-item';
                    previewItem.innerHTML = `
                        <span>${file.name}</span>
                        <button type="button" class="btn btn-sm btn-danger" onclick="removeFile()">Remove</button>
                    `;
                    filePreview.appendChild(previewItem);
                }
            }

            window.removeFile = function() {
                fileInput.value = '';
                filePreview.innerHTML = '';
            };

            // Handle form submission
            projectForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                // Get the submit button and disable it
                const submitButton = projectForm.querySelector('button[type="submit"]');
                const originalButtonText = submitButton.textContent;
                submitButton.disabled = true;
                submitButton.textContent = 'Adding Project...';

                const formData = new FormData();
                formData.append('username', document.getElementById('username').value);
                formData.append('title', document.getElementById('title').value);
                formData.append('description', document.getElementById('description').value);
                formData.append('technologies', JSON.stringify(
                    document.getElementById('technologies').value.split(',').map(t => t.trim())
                ));
                formData.append('startDate', document.getElementById('startDate').value);
                formData.append('endDate', document.getElementById('endDate').value);
                if (fileInput.files.length > 0) {
                    formData.append('projectFile', fileInput.files[0]);
                }

                try {
                    const token = localStorage.getItem('token');
                    if (!token) {
                        throw new Error('You must be logged in to add a project');
                    }

                    const response = await fetch('http://localhost:5000/api/jobseekers/projects', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`
                        },
                        body: formData
                    });

                    const responseData = await response.json();

                    if (!response.ok) {
                        throw new Error(responseData.message || 'Failed to add project');
                    }

                    alert('Project added successfully!');
                    window.location.href = 'index.html';
                
                }
                catch (error) {
                    console.error('Error:', error);
                    alert(error.message || 'An error occurred while adding the project');
                }
                finally {
                    // Re-enable the submit button
                    submitButton.disabled = false;
                    submitButton.textContent = originalButtonText;
                }
            });
        });
    </script>
</body>
</html>
